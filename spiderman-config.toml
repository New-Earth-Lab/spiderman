[[component]]
type = "RTCBlock1"
name = "AstroGrid"
auto_show = false
event-channel = "aeron:ipc"
event-stream = 111
status-channel = "aeron:ipc"
status-stream = 112

event-buttons = [
    # "Exit",
    "Reset",
    "Stop",
    "Play",
    "Pause",
    "StatusRequest",
]
event-fields = [
    # name, type, default
    # Spot separation, cycles per pupil (each of the four spots sits this far
    # from the star, on the x and y axes).
    ["separation", "Float64", "10"],
    # Per-axis ripple amplitude, nm RMS (0 = spots off).
    ["amplitude", "Float64", "0"],
    # Phase modulation rate, Hz. Keep below the Nyquist of the 1 kHz drive
    # (≤ ~250 Hz) and the service stays clear of the ~1.8 kHz DM resonance.
    ["rate", "Float64", "250"],
]


