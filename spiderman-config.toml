    [
        "scc_actus_to_modes",
        "array",
        "/mnt/datadrive/DATA/SCC/active/valid-actus-to-modes.fits",
    ],
    # Modes decross must NOT offset (LLOWFS keeps full authority). Default: tip/tilt
    # (LLOWFS modes 1,2), generated by scripts/make-tiptilt-protect.jl.
    [
        "protect_actus",
        "array",
        "/mnt/datadrive/DATA/MLLOWFS/protect-tiptilt.fits",
    ],
]

