# SCC->LLOWFS decross feedforward offset (static_null + M*u), as injected on the
# ML-LLOWFS control stream's :offset channel. Pairs with "LOWFS Residual" (2001),
# which is the decross learning target. Note: 303 is the shared ML-LLOWFS control
