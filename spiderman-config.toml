[[component]]
type = "ImageFeed"
name = "CRED2"
input-channel = "aeron:ipc"
# Subscribe to the decimated/averaged secondary stream published by
# spiders-imgcal-cred2 (default: 30fps decimation). The averaging controls
# on this panel reconfigure the upstream service via control stream 601.
input-stream = 1111
upstream-control-channel = "aeron:ipc"
upstream-control-stream = 601
auto_show = true
# Sync colorscale with other CRED2 feeds
colorscale-sync-group = "scc-cred2"
# Optional mask overlay files for SCC camera
mask-files = [
    "/mnt/datadrive/DATA/SCC/active/mask-overall.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-phase-correction.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-amplitude-correction.fits",
]

# crop = true
# cropx = [147,467]
# cropy = [67,387]

[[component]]
type = "ImageFeed"
name = "CRED2: Differential"
input-channel = "aeron:ipc"
# Subscribe to the decimated/averaged secondary stream published by
# spiders-choppedframesort (default: 30fps decimation). The averaging
# controls on any of the three SCC panels reconfigure all three decimated
# outputs together via the shared control stream 5004.
input-stream = 5013
upstream-control-channel = "aeron:ipc"
upstream-control-stream = 5004
auto_show = true
# Sync colorscale with other CRED2 feeds
colorscale-sync-group = "scc-cred2"
# Optional mask overlay files for SCC camera
mask-files = [
    "/mnt/datadrive/DATA/SCC/active/mask-overall.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-phase-correction.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-amplitude-correction.fits",
]


# crop = true
# cropx = [147,467]
# cropy = [67,387]


[[component]]
type = "ImageFeed"
name = "CRED2: Un-Fringed"
input-channel = "aeron:ipc"
# Decimated/averaged copy of the un-fringed output (averaging applies to all
# three SCC outputs together; see CRED2: Differential above).
input-stream = 5011
upstream-control-channel = "aeron:ipc"
upstream-control-stream = 5004
auto_show = true
# Sync colorscale with other CRED2 feeds
colorscale-sync-group = "scc-cred2"

# crop = true
# cropx = [147,467]
# cropy = [67,387]
mask-files = [
    "/mnt/datadrive/DATA/SCC/active/mask-overall.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-phase-correction.fits",
    "/mnt/datadrive/DATA/SCC/active/mask-amplitude-correction.fits",
]


[[component]]
type = "ImageFeed"
name = "CRED2: Fringed"
input-channel = "aeron:ipc"
