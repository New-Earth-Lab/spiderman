    ["excitation_floor", "Float64", "1e-8"],
    ["offset_clip", "Float64", "0.5"],
    ["slew_limit", "Float64", "0.05"],
    ["publish_period_us", "Float64", "20000"],
    # Optional: regress in SCC mode space (reuses the SCC integrator's matrix).
